name: spot
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - minimap2>=2.28
  - syri=1.8
  - blast>=2.16
  - gepard=2.1
  - pydantic>=2.6
  - pyyaml>=6.0
  - numpy>=1.24,<2.4  # SyRI 1.8 fails with NumPy 2.4 (array-to-scalar conversion)
  - pandas<3  # SyRI 1.8 is not tested with pandas 3
  - pyfaidx>=0.8
  - matplotlib-base>=3.8
  - scipy>=1.11
  - biopython>=1.81
  - pyside6>=6.7
  - pytest>=8
  - pytest-qt>=4.4
  - mypy>=1.10
  - ruff>=0.5
  - types-pyyaml
  - pip
