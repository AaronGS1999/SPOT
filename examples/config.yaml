orthofinder:
  root: data/orthofinder
  runs:
    run_a: {label: Run A, color: "#C1121F", unit: NUMTs}
    run_b: {label: Run B, color: "#1B7F3B", unit: NUPTs}

species:
  SP1:
    label: Species one
    match: "^SP1_"
    genome: genomes/sp1.fasta
    centromeres: annotations/sp1_centromeres.bed
  SP2:
    label: Species two
    match: "^SP2_"
    genome: genomes/sp2.fasta
    # coordinates in the sequence names refer to an earlier assembly
    lift:
      - lift/split.tsv
      - lift/ragtag.scaffold.agp
    strip_suffix: _RagTag

reference: SP1
query: SP2
profile: default
outdir: spot_out
threads: 8

