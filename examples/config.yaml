# SPOT project. Paths are relative to this file. Commented lines show the default values.

orthofinder:
  root: orthofinder                # one OrthoFinder run per subfolder
  runs:                            # runs to use, in this order (omit to use all)
    run_a: {label: Run A, color: "#C1121F", unit: genes}    # label and unit are used in the figures
    run_b: {label: Run B, color: "#1B7F3B", unit: TEs}

species:
  SP1:
    label: Species one             # name in the figures
    match: SP1                     # start of its column in Orthogroups.tsv
    genome: genomes/sp1.fasta
    centromeres: annotations/sp1_centromeres.bed            # optional, synteny figure only
    # coords: header               # or a table with the columns id, chr, start, end
    # min_identity: 0.99
  SP2:
    label: Species two
    match: SP2
    genome: genomes/sp2.fasta
    lift:                          # only if the coordinates refer to another assembly
      - lift/split.tsv
      - lift/ragtag.scaffold.agp
    strip_suffix: _RagTag

reference: SP1
query: SP2
profile: default                   # default or relaxed
outdir: spot_out
threads: auto
