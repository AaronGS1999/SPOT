description: Same criteria as nuxt_synteny_venn_strict.py (v3 strict) - all anchor types on the homologous chromosome, fixed +-2 kb window, flanks >= 1 kb covered by any HSP, one direction.
anchors:
  types: [SYN, INV, TRANS, INVTR, DUP, INVDP]
  min_syn_frac: 1.0
  tol_frac: 0.0
  min_aligned_frac: 0.0
validation:
  mode: coverage
  reciprocal: false
  min_frac: 0.0
  min_bp: 1000
