[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spot"
dynamic = ["version"]
description = "Synteny-based Positional Orthology Test for OrthoFinder orthogroups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pyfaidx>=0.8",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
spot = "spot.cli:main"

[tool.hatch.version]
path = "src/spot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyfaidx", "pyfaidx.*"]
ignore_missing_imports = true
